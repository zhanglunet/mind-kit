version: 1
project: my-second-brain
description: "我的第二大脑 — AI/科技知识库"

sources:
  - path: raw/clippings
    type: auto
    watch: true
  - path: raw/flomo/delta
    type: auto
    watch: true
  - path: raw/pdfs
    type: auto
    watch: false

ignore:
  - raw/archive
  - raw/todo
  - raw/flomo
  - raw/assets
  - material
  - writing
  - reports
  - docs
  - site
  - scripts
  - .obsidian
  - .claudian
  - .claude

output: _wiki

api:
  provider: openai-compatible
  base_url: https://open.bigmodel.cn/api/coding/paas/v4
  api_key: ${GLM_API_KEY}
  extra_params:
    thinking:
      type: disabled

models:
  summarize: glm-4.5-flash
  extract: glm-4.5-flash
  write: glm-4.5-flash
  lint: glm-4.5-flash
  query: glm-4.5-flash

compiler:
  max_parallel: 2
  debounce_seconds: 2
  summary_max_tokens: 1500
  extract_batch_size: 1
  extract_max_tokens: 8000
  article_max_tokens: 3000
  auto_commit: false
  auto_lint: true

search:
  hybrid_weight_bm25: 0.7
  hybrid_weight_vector: 0.3
