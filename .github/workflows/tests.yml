name: tests

# 每次 push(任意分支)与 PR 自动跑 pytest —— 脚本改动的 pytest-first 纪律的 CI 强制层。
# 见 CLAUDE.md「开发纪律」与 tests/README.md。
on:
  push:
  pull_request:

# 同一分支的新 push 取消尚在跑的旧 CI,省额度
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 运行时依赖也要装:tests/test_build_wiki_site.py 在 **collection 期**就
      # exec_module 了 build-wiki-site.py,后者 import markdown。缺它不是"少跑一个
      # 测试",是 collection error → **退出码 2、整套件零执行**(2026-08-04 起真实
      # 发生,CI 从那天到 08-06 没有真正检查过任何一次 push)。
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run pytest
        run: python -m pytest -q
